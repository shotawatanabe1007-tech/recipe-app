<svg width="520" height="150" viewBox="0 0 520 150" xmlns="http://www.w3.org/2000/svg">
  <rect width="520" height="150" fill="#eff6ff" rx="8"/>

  <!-- Left: smartphones illustration -->
  <!-- Phone 3 (back) -->
  <g transform="translate(58,78) rotate(-12)">
    <rect x="-14" y="-32" width="28" height="56" rx="4" fill="none" stroke="#bfdbfe" stroke-width="1.8"/>
    <rect x="-9" y="-24" width="18" height="30" rx="1" fill="#dbeafe"/>
  </g>
  <!-- Phone 1 (center front) -->
  <g transform="translate(78,76)">
    <rect x="-15" y="-36" width="30" height="58" rx="4" fill="white" stroke="#3b82f6" stroke-width="2.2"/>
    <rect x="-10" y="-28" width="20" height="34" rx="2" fill="#dbeafe"/>
    <!-- signal bars on screen -->
    <rect x="-6" y="-2" width="4" height="-8" rx="1" fill="#1d4ed8"/>
    <rect x="0" y="-2" width="4" height="-14" rx="1" fill="#2563eb"/>
    <rect x="6" y="-2" width="4" height="-20" rx="1" fill="#3b82f6"/>
    <!-- home button -->
    <circle cy="18" r="3.5" fill="#93c5fd"/>
    <!-- notch -->
    <rect x="-5" y="-34" width="10" height="4" rx="2" fill="#93c5fd"/>
  </g>
  <!-- Phone 2 (right) -->
  <g transform="translate(105,80) rotate(10)">
    <rect x="-13" y="-30" width="26" height="52" rx="4" fill="none" stroke="#93c5fd" stroke-width="1.8"/>
    <rect x="-8" y="-22" width="16" height="28" rx="1" fill="#dbeafe"/>
  </g>

  <!-- Cost down arrow circle -->
  <circle cx="160" cy="75" r="28" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <polygon points="160,58 172,75 148,75" fill="#2563eb"/>
  <rect x="155" y="75" width="10" height="14" rx="2" fill="#2563eb"/>
  <text x="160" y="118" text-anchor="middle" fill="#1d4ed8" font-size="11" font-weight="bold" font-family="Arial,sans-serif">コスト削減</text>
  <text x="160" y="132" text-anchor="middle" fill="#3b82f6" font-size="10" font-family="Arial,sans-serif">最大40%</text>

  <!-- Vertical divider -->
  <line x1="205" y1="15" x2="205" y2="135" stroke="#bfdbfe" stroke-width="1.5"/>

  <!-- Features list -->
  <text x="222" y="40" fill="#1e3a8a" font-size="16" font-weight="bold" font-family="Arial,sans-serif">法人モバイル</text>
  <text x="222" y="64" fill="#374151" font-size="13" font-family="Arial,sans-serif">✓ 国内通話かけ放題</text>
  <text x="222" y="84" fill="#374151" font-size="13" font-family="Arial,sans-serif">✓ 大容量データ共有プール</text>
  <text x="222" y="104" fill="#374151" font-size="13" font-family="Arial,sans-serif">✓ 端末調達〜設定まで一括対応</text>
  <text x="222" y="124" fill="#374151" font-size="13" font-family="Arial,sans-serif">✓ 最低3回線〜・SIMのみも可</text>

  <!-- Vertical divider 2 -->
  <line x1="400" y1="15" x2="400" y2="135" stroke="#bfdbfe" stroke-width="1.5"/>

  <!-- Price block -->
  <text x="460" y="50" text-anchor="middle" fill="#6b7280" font-size="12" font-family="Arial,sans-serif">月額</text>
  <text x="460" y="82" text-anchor="middle" fill="#1d4ed8" font-size="28" font-weight="bold" font-family="Arial,sans-serif">¥1,980</text>
  <text x="460" y="98" text-anchor="middle" fill="#6b7280" font-size="11" font-family="Arial,sans-serif">〜 / 回線（税抜）</text>
  <rect x="420" y="108" width="80" height="24" rx="12" fill="#2563eb"/>
  <text x="460" y="125" text-anchor="middle" fill="white" font-size="11" font-weight="bold" font-family="Arial,sans-serif">初期費用 0円</text>
</svg>

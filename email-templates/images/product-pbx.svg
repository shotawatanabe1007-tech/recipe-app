<svg width="520" height="150" viewBox="0 0 520 150" xmlns="http://www.w3.org/2000/svg">
  <rect width="520" height="150" fill="#f0fdf4" rx="8"/>

  <!-- Left: office desk phone (crossed out) -->
  <g transform="translate(48,76)">
    <!-- phone base -->
    <rect x="-26" y="-20" width="52" height="34" rx="4" fill="none" stroke="#86efac" stroke-width="2"/>
    <!-- display area -->
    <rect x="-18" y="-14" width="30" height="16" rx="2" fill="#dcfce7"/>
    <!-- dial buttons -->
    <circle cx="-8" cy="6" r="2.5" fill="#4ade80"/>
    <circle cx="0" cy="6" r="2.5" fill="#4ade80"/>
    <circle cx="8" cy="6" r="2.5" fill="#4ade80"/>
    <!-- handset -->
    <path d="M-28,-22 Q-34,-32 -22,-32 Q-10,-32 -8,-22" fill="none" stroke="#86efac" stroke-width="2.5" stroke-linecap="round"/>
    <!-- base foot -->
    <rect x="-30" y="14" width="60" height="6" rx="3" fill="#bbf7d0"/>
  </g>
  <!-- X mark over phone -->
  <line x1="30" y1="50" x2="58" y2="78" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="50" x2="30" y2="78" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <text x="47" y="100" text-anchor="middle" fill="#dc2626" font-size="9" font-family="Arial,sans-serif" font-weight="bold">機器不要</text>

  <!-- Arrow 1 -->
  <path d="M80,76 Q96,70 104,76" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="5,3"/>
  <polygon points="102,72 110,76 102,80" fill="#16a34a"/>

  <!-- Center: cloud -->
  <g transform="translate(140,72)">
    <path d="M-26,14 Q-28,-2 -14,-4 Q-10,-16 4,-12 Q14,-14 18,-6 Q24,-6 24,2 Q24,10 16,10 L-26,10 Q-32,10 -32,4 Q-32,-2 -26,14Z" fill="#dcfce7" stroke="#22c55e" stroke-width="2" stroke-linejoin="round"/>
    <!-- wifi icon above cloud -->
    <path d="M-10,-18 Q0,-24 10,-18" fill="none" stroke="#4ade80" stroke-width="2"/>
    <path d="M-6,-14 Q0,-18 6,-14" fill="none" stroke="#22c55e" stroke-width="1.8"/>
    <circle cy="-10" r="2.5" fill="#16a34a"/>
    <!-- lines from cloud bottom -->
    <line x1="-10" y1="10" x2="-10" y2="20" stroke="#22c55e" stroke-width="2"/>
    <line x1="4" y1="10" x2="4" y2="20" stroke="#22c55e" stroke-width="2"/>
    <text x="-3" y="30" text-anchor="middle" fill="#15803d" font-size="9" font-weight="bold" font-family="Arial,sans-serif">クラウドPBX</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M178,76 Q190,70 198,76" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="5,3"/>
  <polygon points="196,72 204,76 196,80" fill="#16a34a"/>

  <!-- Right: laptop + phone at home -->
  <g transform="translate(228,76)">
    <!-- laptop -->
    <rect x="-26" y="-28" width="44" height="32" rx="3" fill="none" stroke="#4ade80" stroke-width="2"/>
    <rect x="-20" y="-22" width="32" height="20" rx="1" fill="#dcfce7"/>
    <!-- laptop base -->
    <rect x="-30" y="4" width="52" height="5" rx="2.5" fill="#bbf7d0"/>
    <!-- screen content lines -->
    <rect x="-14" y="-18" width="20" height="3" rx="1" fill="#4ade80"/>
    <rect x="-14" y="-12" width="14" height="3" rx="1" fill="#86efac"/>
    <!-- small phone beside laptop -->
    <rect x="22" y="-20" width="14" height="24" rx="3" fill="white" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="25" y="-15" width="8" height="14" rx="1" fill="#dcfce7"/>
    <circle cx="29" cy="2" r="1.5" fill="#4ade80"/>
    <text x="0" y="25" text-anchor="middle" fill="#15803d" font-size="10" font-weight="bold" font-family="Arial,sans-serif">テレワーク対応</text>
  </g>

  <!-- Vertical divider -->
  <line x1="290" y1="15" x2="290" y2="135" stroke="#bbf7d0" stroke-width="1.5"/>

  <!-- Features list -->
  <text x="308" y="40" fill="#14532d" font-size="16" font-weight="bold" font-family="Arial,sans-serif">クラウドPBX</text>
  <text x="308" y="64" fill="#374151" font-size="13" font-family="Arial,sans-serif">✓ 工事・専用機器が不要</text>
  <text x="308" y="84" fill="#374151" font-size="13" font-family="Arial,sans-serif">✓ 会社番号でスマホ発着信</text>
  <text x="308" y="104" fill="#374151" font-size="13" font-family="Arial,sans-serif">✓ 転送・内線・保留も完備</text>
  <text x="308" y="124" fill="#374151" font-size="13" font-family="Arial,sans-serif">✓ 最短3営業日で開通</text>

  <!-- Vertical divider 2 -->
  <line x1="485" y1="15" x2="485" y2="135" stroke="#bbf7d0" stroke-width="1.5"/>

  <!-- Price block -->
  <text x="505" y="50" text-anchor="middle" fill="#6b7280" font-size="12" font-family="Arial,sans-serif">月額</text>
  <text x="505" y="82" text-anchor="middle" fill="#15803d" font-size="28" font-weight="bold" font-family="Arial,sans-serif">¥3,000</text>
  <text x="505" y="98" text-anchor="middle" fill="#6b7280" font-size="11" font-family="Arial,sans-serif">〜（税抜）</text>
  <rect x="468" y="108" width="74" height="24" rx="12" fill="#16a34a"/>
  <text x="505" y="125" text-anchor="middle" fill="white" font-size="11" font-weight="bold" font-family="Arial,sans-serif">工事費 0円</text>
</svg>
